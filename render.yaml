# Free Render blueprint. Paper allows Railway or Render for the Laravel API.
# MySQL is not free on Render; set DB_* after you attach a free MySQL-compatible host.
#
# Queued mail: prefer QUEUE_CONNECTION=sync on Render free (see render.env.example).
# Side effects use dispatch()->afterResponse() so the HTTP response stays fast without a
# worker. If you add a free always-on worker elsewhere, use:
#   php artisan queue:work database --queue=default,mail,exports --sleep=1 --tries=3 --timeout=90 --max-time=3600
# Auth emails (login code, verification, password reset) stay synchronous either way.
services:
  - type: web
    name: adams-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: ADAMS Archiving System
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: cookie
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: file
      - key: FILESYSTEM_DISK
        value: local
      - key: EVIDENCE_DISK
        value: s3
      - key: ENABLE_LOCAL_DB_BACKUP
        value: "false"
      - key: SECURITY_FORCE_HTTPS
        value: "true"
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"
      - key: AWS_DEFAULT_REGION
        value: ap-southeast-1
      - key: DB_CONNECTION
        value: mysql
