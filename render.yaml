# Free Render blueprint. Paper allows Railway or Render for the Laravel API.
# MySQL is not free on Render; set DB_* after you attach a free MySQL-compatible host.
services:
  - type: web
    name: adams-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: ADAMS Archiving System
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: cookie
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: QUEUE_CONNECTION
        value: sync
      - key: CACHE_STORE
        value: file
      - key: FILESYSTEM_DISK
        value: local
      - key: EVIDENCE_DISK
        value: s3
      - key: ENABLE_LOCAL_DB_BACKUP
        value: "false"
      - key: SECURITY_FORCE_HTTPS
        value: "true"
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"
      - key: AWS_DEFAULT_REGION
        value: ap-southeast-1
      - key: DB_CONNECTION
        value: mysql
